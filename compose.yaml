services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: carhaul
      POSTGRES_USER: carhaul
      POSTGRES_PASSWORD: carhaul_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recruiting_db:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  recruiting_db:
